<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Control de Almacén</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/navegacion.css">
</head>

<body>

    <main class="container">
        <section class="hero-section">
            <div class="hero-content">
                <h1>Bienvenido a <span class="highlight">su sistema de gestión de almacén</span></h1>
                <p class="tagline">Optimización logística y control de flujo en tiempo real.</p>

            </div>
        </section>

        <hr class="separator">

        <section class="stats-section">
            <div class="section-title">
                <h2>Estado General</h2>
            </div>

            <div class="grid-stats">
                <div class="card">
                    <div class="card-icon">📦</div>
                    <div class="card-info">
                        <h3>Artículos Registrados</h3>
                        <span class="value" id="total-art">--</span>
                    </div>
                </div>
                <div class="card success">
                    <div class="card-icon">📈</div>
                    <div class="card-info">
                        <h3>Stock Global</h3>
                        <span class="value" id="total-stock">--</span>
                    </div>
                </div>
                <div class="card danger">
                    <div class="card-icon">⚠️</div>
                    <div class="card-info">
                        <h3>Alertas Stock Bajo</h3>
                        <span class="value">0</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/navegacion.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
