<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Entrada de Mercancía</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/ferreteria/entradas.css">
</head>

<body>

    <main class="container">
        <header class="toolbar">
            <div class="toolbar-title">
                <h1>📥 Entrada de Mercancía</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool" title="Guardar Entrada">💾 Guardar</button>
                <button class="btn-tool" title="Limpiar Formulario">🧹 Limpiar</button>
                <button class="btn-tool btn-help" title="Ayuda">❓</button>
            </div>
        </header>

        <form class="entry-form">
            <fieldset class="form-section">
                <legend>Datos del Albarán / Factura</legend>
                <div class="form-grid">
                    <div class="field">
                        <label>Fecha Entrada</label>
                        <input type="date" value="2026-04-23">
                    </div>
                    <div class="field">
                        <label>Cod. Proveedor</label>
                        <input type="text" placeholder="Ej: PROV-001">
                    </div>
                    <div class="field span-2">
                        <label>Nombre del Proveedor</label>
                        <input type="text" placeholder="Buscando proveedor..." readonly class="readonly-input">
                    </div>
                    <div class="field">
                        <label>Nº Albarán</label>
                        <input type="text" placeholder="Ej: ALB-8822">
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-section highlight-section">
                <legend>Detalle del Artículo</legend>
                <div class="form-grid-detail">
                    <div class="field">
                        <label>Código Artículo</label>
                        <input type="text" placeholder="F1-22...">
                    </div>
                    <div class="field span-3">
                        <label>Descripción</label>
                        <input type="text" readonly class="readonly-input" placeholder="Nombre del producto">
                    </div>
                    <div class="field">
                        <label>Cantidad</label>
                        <input type="number" step="0.01" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Precio Costo</label>
                        <input type="number" step="0.01" placeholder="0.00 €">
                    </div>
                    <div class="field">
                        <label>% Dto.</label>
                        <input type="number" placeholder="0">
                    </div>
                    <div class="field">
                        <label>Total Línea</label>
                        <input type="text" readonly class="readonly-input" placeholder="0.00 €">
                    </div>
                    <div class="field span-2">
                        <label>Trabajador Destino</label>
                        <input type="text" placeholder="Seleccione operario...">
                    </div>
                </div>
            </fieldset>

            <div class="preview-table-wrapper">
                <h3>Resumen de Carga</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Artículo</th>
                            <th>Descripción</th>
                            <th>Cant.</th>
                            <th>Precio</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="placeholder-row">
                            <td colspan="6">Escanee o introduzca artículos para visualizar la carga actual...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </main>

    <script src="../../js/navegacion.js"></script>
</body>

</html>
