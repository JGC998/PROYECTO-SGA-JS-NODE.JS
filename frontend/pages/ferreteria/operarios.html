<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Gestión de Operarios</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/ferreteria/operarios.css">
</head>

<body>

    <main class="container">
        <header class="section-header">
            <div class="header-left">
                <h1>Maestro de Operarios</h1>
                <p>Personal autorizado para retiradas y movimientos de almacén</p>
            </div>
            <div class="header-actions">
                <button class="btn-tool primary">+ Añadir Operario</button>
                <button class="btn-tool secondary">📤 Exportar</button>
            </div>
        </header>

        <div class="status-summary">
            <div class="status-item">
                <span class="label">Total Operarios:</span>
                <span class="count" id="total-operarios">—</span>
            </div>
        </div>

        <section class="table-section">
            <div class="search-box">
                <input type="text" placeholder="🔍 Buscar por nombre, código o departamento..." class="search-bar">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Cód. Operario</th>
                            <th>Nombre Completo</th>
                            <th>Dirección</th>
                            <th>Persona de Contacto</th>
                            <th>Email Corporativo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-operarios">
                        <tr><td colspan="7" class="loading">Cargando operarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../js/navegacion.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/ferreteria/operarios.js"></script>
</body>

</html>
