<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Gestión de Proveedores</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/ferreteria/proveedores.css">
</head>

<body>

    <main class="container">
        <header class="section-header">
            <div class="header-left">
                <h1>Maestro de Proveedores</h1>
                <p>Gestión de empresas suministradoras y contactos comerciales</p>
            </div>
            <div class="header-actions">
                <button class="btn-tool primary">+ Nuevo Proveedor</button>
                <button class="btn-tool secondary">📊 Informe Compras</button>
            </div>
        </header>

        <section class="table-section">
            <div class="search-box">
                <input type="text" placeholder="🔍 Buscar por CIF, nombre, dirección o contacto..." class="search-bar">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Cód. Proveedor</th>
                            <th>Nombre del Proveedor</th>
                            <th>Dirección</th>
                            <th>Persona de Contacto</th>
                            <th>Email</th>
                            <th>Calificación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-proveedores">
                        <tr><td colspan="7" class="loading">Cargando proveedores...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../js/navegacion.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/ferreteria/proveedores.js"></script>
</body>

</html>
