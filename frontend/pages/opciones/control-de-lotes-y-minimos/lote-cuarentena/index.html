<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Lote en Cuarentena por Artículo</title>
    <link rel="stylesheet" href="../../../../css/navegacion.css">
    <link rel="stylesheet" href="../../../../css/opciones/control-de-lotes-y-minimos/lote-cuarentena/index.css">
</head>

<body>

    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>🏷️ Lote en Cuarentena por Artículo</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool">💾 Guardar</button>
                <button class="btn-tool secondary">🧹 Limpiar</button>
            </div>
        </header>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Artículo</th>
                        <th>Nombre de artículo</th>
                        <th>Lote en cuarentena</th>
                        <th>Observaciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-num">1</td>
                        <td><input type="text" class="cell-input"></td>
                        <td><input type="text" class="cell-input" readonly></td>
                        <td><input type="text" class="cell-input"></td>
                        <td><input type="text" class="cell-input"></td>
                    </tr>
                    <tr class="placeholder-row">
                        <td colspan="5">Introduzca artículos para gestionar los lotes en cuarentena.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../../js/navegacion.js"></script>
</body>

</html>
