<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Subfamilias</title>
    <link rel="stylesheet" href="../../../../css/navegacion.css">
    <link rel="stylesheet" href="../../../../css/opciones/control-de-lotes-y-minimos/subfamilias/index.css">
</head>

<body>

    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>Subfamilias</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool" id="btn-actualizar">Actualizar (F5)</button>
                <button class="btn-tool secondary" id="btn-nuevo">Nueva fila</button>
                <button class="btn-tool secondary" id="btn-guardar">Guardar</button>
            </div>
        </header>

        <div class="table-wrapper">
            <table id="tabla-subfamilias">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Subfamilia</th>
                        <th>Nombre de subfamilia</th>
                        <th class="col-check">Sin control de lote</th>
                    </tr>
                </thead>
                <tbody id="tbody-subfamilias">
                    <tr class="edit-row" data-id="new-1">
                        <td class="col-num">1</td>
                        <td><input type="text" class="cell-input cell-code" placeholder="Código"></td>
                        <td><input type="text" class="cell-input cell-wide" placeholder="Nombre de subfamilia"></td>
                        <td class="col-check"><input type="checkbox" class="cell-check"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../../js/navegacion.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/control-de-lotes-y-minimos/subfamilias.js"></script>
</body>

</html>
