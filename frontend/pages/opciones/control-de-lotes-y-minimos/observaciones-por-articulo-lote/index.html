<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Observaciones por Artículo y Lote</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/control-de-lotes-y-minimos/observaciones-por-articulo-lote/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Control de Lotes y Mínimos</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Observaciones por Artículo y Lote</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="container">

                <header class="page-toolbar">
                    <div class="toolbar-left">
                        <h1>Observaciones por Artículo y Lote</h1>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn-tool" id="btn-actualizar">Actualizar (F5)</button>
                        <button class="btn-tool secondary" id="btn-nuevo">Nueva fila</button>
                        <button class="btn-tool secondary" id="btn-guardar">Guardar</button>
                    </div>
                </header>

                <div class="filter-panel">
                    <div class="filter-row">
                        <label>Artículo:</label>
                        <input type="text" class="sga-input input-sm" id="f-articulo">
                        <button class="btn-browse">...</button>
                        <input type="text" class="sga-input input-desc" readonly id="f-articulo-nombre">
                    </div>
                </div>

                <div class="table-wrapper" id="obs-table-wrapper" aria-live="polite" aria-atomic="false">
                    <table id="tabla-obs">
                        <thead>
                            <tr>
                                <th class="col-num">#</th>
                                <th>Artículo</th>
                                <th>Nombre de artículo</th>
                                <th>Lote</th>
                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-obs">
                            <tr class="edit-row" data-id="new-1">
                                <td class="col-num">1</td>
                                <td><input type="text" class="cell-input" placeholder="Artículo"></td>
                                <td><input type="text" class="cell-input cell-wide" placeholder="Nombre" readonly></td>
                                <td><input type="text" class="cell-input" placeholder="Lote"></td>
                                <td><input type="text" class="cell-input cell-obs" placeholder="Observaciones"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/control-de-lotes-y-minimos/observaciones-por-articulo-lote.js"></script>
</body>

</html>
