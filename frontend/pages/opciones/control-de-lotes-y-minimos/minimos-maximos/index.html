<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Mínimos y Máximos por Artículo</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/control-de-lotes-y-minimos/minimos-maximos/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Control de Lotes y Mínimos</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Mínimos y Máximos</span>
                </nav>
            </div>
            <div class="sga-header-right">
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-actualizar">Actualizar (F5)</button>
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-nuevo">Nueva fila</button>
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-guardar">Guardar</button>
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-exportar">Exportar a CSV</button>
            </div>
        </header>

        <div class="sga-content">
            <main class="mm-inner">

                <div class="mm-page-header">
                    <h1 class="sga-page-title">Mínimos y Máximos por Artículo</h1>
                    <p class="sga-page-description">Lotes · SGA LIN</p>
                </div>

                <div class="filter-bar">
                    <label>Artículo:</label>
                    <input type="text" class="input-code" id="f-articulo">
                    <button class="btn-browse">...</button>
                    <input type="text" class="input-desc" readonly id="f-articulo-nombre">
                </div>

                <div class="mm-table-card">
                <div class="table-wrapper" id="minmax-table-wrapper" aria-live="polite" aria-atomic="false">
                    <table id="tabla-minmax">
                        <thead>
                            <tr>
                                <th class="col-num">#</th>
                                <th>Artículo</th>
                                <th>Nombre de artículo</th>
                                <th>Stock mínimo</th>
                                <th>Stock máximo</th>
                                <th>Stock actual</th>
                                <th>Ubicación</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-minmax">
                            <tr class="edit-row" data-id="new-1">
                                <td class="col-num">1</td>
                                <td><input type="text" class="cell-input" placeholder="Artículo"></td>
                                <td><input type="text" class="cell-input cell-wide" placeholder="Nombre" readonly></td>
                                <td><input type="number" class="cell-input cell-num" value="0" min="0"></td>
                                <td><input type="number" class="cell-input cell-num" value="0" min="0"></td>
                                <td><input type="number" class="cell-input cell-num" value="0" readonly></td>
                                <td><input type="text" class="cell-input" placeholder="Ubicación"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                </div><!-- /.mm-table-card -->

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/control-de-lotes-y-minimos/minimos-maximos.js"></script>
</body>

</html>
