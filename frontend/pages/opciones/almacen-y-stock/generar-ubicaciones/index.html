<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Generar Ubicaciones</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/almacen-y-stock/generar-ubicaciones/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Almacén y Stock</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Generar Ubicaciones</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="gu-inner">

                <div class="gu-page-header">
                    <h1 class="sga-page-title">Generar Ubicaciones</h1>
                    <p class="sga-page-description">Almacén · SGA LIN</p>
                </div>

                <div class="main-layout">
                    <!-- Panel izquierdo: tabla de ubicaciones generadas -->
                    <div class="left-panel">
                        <div class="check-row">
                            <label class="checkbox-label">
                                <input type="checkbox"> Mostrar ubicaciones no existentes con movimientos
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox"> Solo con existencias
                            </label>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th class="col-num">#</th>
                                        <th>Sel</th>
                                        <th>Ubicación</th>
                                        <th>Etiqueta</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="col-num">1</td>
                                        <td><input type="checkbox"></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Panel derecho: formulario de generación -->
                    <div class="right-panel">
                        <div class="form-section">
                            <div class="form-section-title">Parámetros de generación</div>

                            <div class="gu-range-grid">
                                <!-- Cabecera -->
                                <div class="gu-range-head"></div>
                                <div class="gu-range-head">Desde</div>
                                <div class="gu-range-head">Hasta</div>

                                <!-- Pasillo -->
                                <div class="gu-range-label">Pasillo</div>
                                <input type="number" class="input-param sga-input" id="gu-desde-pasillo" placeholder="ej. P001 → 1" min="1">
                                <input type="number" class="input-param sga-input" id="gu-hasta-pasillo" placeholder="ej. P010 → 10" min="1">

                                <!-- Lateral -->
                                <div class="gu-range-label">Lateral</div>
                                <select class="input-param sga-input" id="gu-lateral">
                                    <option value="ambos">Ambos (I y D)</option>
                                    <option value="I">Izquierda (I)</option>
                                    <option value="D">Derecha (D)</option>
                                </select>
                                <div></div>

                                <!-- X (columna) -->
                                <div class="gu-range-label">Columna (X)</div>
                                <input type="number" class="input-param sga-input" id="gu-desde-x" placeholder="ej. 1" min="1" value="1">
                                <input type="number" class="input-param sga-input" id="gu-hasta-x" placeholder="ej. 5" min="1" value="1">

                                <!-- Y (altura) -->
                                <div class="gu-range-label">Altura (Y)</div>
                                <input type="number" class="input-param sga-input" id="gu-desde-y" placeholder="ej. 1" min="1" value="1">
                                <input type="number" class="input-param sga-input" id="gu-hasta-y" placeholder="ej. 4" min="1" value="1">
                            </div>

                            <div class="gu-extra-grid">
                                <div class="gu-range-label">Ancho</div>
                                <input type="number" class="input-param sga-input" id="gu-ancho" value="0" min="0">
                                <div class="gu-range-label">Alto</div>
                                <input type="number" class="input-param sga-input" id="gu-alto" value="0" min="0">
                                <div class="gu-range-label">Palets</div>
                                <input type="number" class="input-param sga-input" id="gu-palets" value="0" min="0">
                            </div>

                            <div class="gu-bottom-row">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="gu-multiple"> Ubicación múltiple
                                </label>
                                <select class="select-picking sga-input" id="gu-picking">
                                    <option value="Picking">Picking</option>
                                    <option value="Reserva">Reserva</option>
                                    <option value="Suelo">Suelo</option>
                                </select>
                            </div>

                            <div class="gu-preview" id="gu-preview"></div>

                            <div class="ok-row">
                                <button class="btn-ok" type="button">Generar ubicaciones</button>
                            </div>
                        </div><!-- /.form-section -->

                        <div class="action-buttons">
                            <button class="btn-action danger">Eliminar ubicaciones y movimientos</button>
                        </div>
                    </div>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/almacen-y-stock/generar-ubicaciones.js"></script>
</body>

</html>
