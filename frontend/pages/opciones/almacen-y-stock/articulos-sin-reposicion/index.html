<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Artículos sin Reposición Automática</title>
    <link rel="stylesheet" href="../../../../css/navegacion.css">
    <link rel="stylesheet" href="../../../../css/opciones/almacen-y-stock/articulos-sin-reposicion/index.css">
</head>

<body>

    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>🔄 Artículos sin Reposición Automática</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool">Actualizar (F5)</button>
            </div>
        </header>

        <div class="filter-bar">
            <label>Artículo:</label>
            <input type="text" class="input-code" placeholder="">
            <button class="btn-browse">...</button>
            <input type="text" class="input-desc" placeholder="" readonly>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Artículo</th>
                        <th>Nombre de artículo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="placeholder-row">
                        <td colspan="3">No hay artículos sin reposición automática.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../../js/navegacion.js"></script>
</body>

</html>
