<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Historial de movimientos</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/forms.css">
    <link rel="stylesheet" href="../../../../css/tables.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/almacen-y-stock/regularizaciones/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Almacén y Stock</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Historial de movimientos</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="rg-inner">

                <!-- CABECERA -->
                <div class="rg-page-header">
                    <h1 class="sga-page-title">Historial de movimientos</h1>
                    <p class="sga-page-description">Entradas, salidas, traspasos y regularizaciones · SGA LIN</p>
                </div>

                <!-- PANEL FILTROS -->
                <section class="rg-filters-panel">
                    <div class="rg-filters-panel-title">Filtros</div>

                    <div class="rg-filters-row">
                        <div class="rg-filter-group">
                            <label class="rg-label" for="f-articulo">Artículo</label>
                            <input type="text" id="f-articulo" class="rg-input"
                                   placeholder="Código de artículo…" autocomplete="off">
                        </div>
                        <div class="rg-filter-group">
                            <label class="rg-label" for="f-desde">Desde</label>
                            <input type="date" id="f-desde" class="rg-input rg-input--date">
                        </div>
                        <div class="rg-filter-group">
                            <label class="rg-label" for="f-hasta">Hasta</label>
                            <input type="date" id="f-hasta" class="rg-input rg-input--date">
                        </div>
                        <div class="rg-filter-actions">
                            <button class="rg-btn-buscar" id="btn-actualizar" type="button">
                                Buscar
                            </button>
                        </div>
                    </div>

                    <div class="rg-status" id="rg-status" role="status" aria-live="polite" hidden></div>
                </section>

                <!-- TABLA RESULTADOS -->
                <div class="rg-table-card">
                    <div class="table-wrapper" id="rg-table-wrapper" aria-live="polite" aria-atomic="false">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Documento</th>
                                    <th>Tipo</th>
                                    <th>Artículo</th>
                                    <th>Nombre</th>
                                    <th>Ubicación</th>
                                    <th>Lote</th>
                                    <th class="col-num">Cantidad</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-reg">
                                <tr class="placeholder-row">
                                    <td colspan="8">Introduce los filtros y pulsa <strong>Buscar</strong>.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div><!-- /.rg-table-card -->

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/almacen-y-stock/regularizaciones.js"></script>
</body>

</html>
