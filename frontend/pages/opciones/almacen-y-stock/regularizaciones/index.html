<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Regularizaciones</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/forms.css">
    <link rel="stylesheet" href="../../../../css/tables.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/almacen-y-stock/regularizaciones/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Almacén y Stock</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Regularizaciones</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="container">

                <header class="page-toolbar">
                    <div class="toolbar-left">
                        <h1>Regularizaciones</h1>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn-tool" id="btn-actualizar">Actualizar (F5)</button>
                    </div>
                </header>

                <div class="filter-bar">
                    <label>Artículo:</label>
                    <input type="text" class="input-code" id="f-articulo" placeholder="Código artículo">
                    <label>Desde:</label>
                    <input type="date" class="input-date" id="f-desde">
                    <label>Hasta:</label>
                    <input type="date" class="input-date" id="f-hasta">
                </div>

                <div class="rg-status" id="rg-status" role="status" aria-live="polite" hidden></div>

                <div class="table-wrapper" id="rg-table-wrapper" aria-live="polite" aria-atomic="false">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Documento</th>
                                <th>Artículo</th>
                                <th>Nombre</th>
                                <th>Ubicación</th>
                                <th>Lote</th>
                                <th class="col-num">Cantidad</th>
                                <th>Tercero</th>
                                <th>Nombre tercero</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-reg">
                            <tr class="placeholder-row">
                                <td colspan="9">Pulse Actualizar para cargar los datos.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/almacen-y-stock/regularizaciones.js"></script>
</body>

</html>
