<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Regularizaciones</title>
    <link rel="stylesheet" href="../../../../../css/navegacion.css">
    <style>
        .page-toolbar { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #ddd; margin-bottom:12px; }
        .toolbar-left h1 { font-size:1.2rem; margin:0; }
        .toolbar-actions { display:flex; gap:8px; }
        .filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; margin-bottom:8px; }
        .input-code { width:120px; padding:4px 6px; border:1px solid #ccc; border-radius:3px; }
        .input-date { padding:4px 6px; border:1px solid #ccc; border-radius:3px; }
        .btn-tool { padding:5px 12px; background:#0057b7; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:.85rem; }
        .btn-tool:hover { background:#004499; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:.85rem; }
        th { background:#f0f4f8; padding:6px 8px; text-align:left; border-bottom:2px solid #ccc; white-space:nowrap; }
        td { padding:5px 8px; border-bottom:1px solid #eee; }
        tr:hover td { background:#f9fafb; }
        .placeholder-row td { text-align:center; color:#888; padding:20px; }
        .col-num { text-align:right; }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>📋 Regularizaciones</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool" id="btn-actualizar">Actualizar (F5)</button>
            </div>
        </header>

        <div class="filter-bar">
            <label>Artículo:</label>
            <input type="text" class="input-code" id="f-articulo" placeholder="Código artículo">
            <label>Desde:</label>
            <input type="date" class="input-date" id="f-desde">
            <label>Hasta:</label>
            <input type="date" class="input-date" id="f-hasta">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Documento</th>
                        <th>Artículo</th>
                        <th>Nombre</th>
                        <th>Ubicación</th>
                        <th>Lote</th>
                        <th class="col-num">Cantidad</th>
                        <th>Tercero</th>
                        <th>Nombre tercero</th>
                    </tr>
                </thead>
                <tbody id="tbody-reg">
                    <tr class="placeholder-row">
                        <td colspan="9">Pulse Actualizar para cargar los datos.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../../../js/navegacion.js"></script>
    <script src="../../../../../js/api.js"></script>
    <script src="../../../../../js/opciones/almacen-y-stock/regularizaciones.js"></script>
</body>

</html>
