<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Artículos por Ubicación</title>
    <link rel="stylesheet" href="../../../../css/navegacion.css">
    <link rel="stylesheet" href="../../../../css/opciones/almacen-y-stock/articulos-por-ubicacion/index.css">
</head>

<body>

    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>📦 Artículos por Ubicación</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool">Actualizar (F5)</button>
                <button class="btn-tool secondary">Importar stocks</button>
                <button class="btn-tool secondary">Exclusivas al suelo sin stock</button>
            </div>
        </header>

        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Ubicación:</label>
                    <input type="text" class="input-sm">
                    <label>P:</label>
                    <input type="text" class="input-xs">
                    <label>L:</label>
                    <input type="text" class="input-xs">
                    <select class="input-xs-sel"><option></option></select>
                    <label>X:</label>
                    <input type="text" class="input-xs">
                    <label>Y:</label>
                    <input type="text" class="input-xs">
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label>Artículo:</label>
                    <input type="text" class="input-sm">
                    <button class="btn-browse">...</button>
                    <input type="text" class="input-desc" readonly>
                    <label class="checkbox-label">
                        <input type="checkbox"> Incluir ubicaciones sin artículos asignados
                    </label>
                    <button class="btn-tool secondary">Asignar ubicación en compras</button>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-check"><input type="checkbox"></th>
                        <th>Sel</th>
                        <th>Ubicación</th>
                        <th>Etiqueta</th>
                        <th>Artículo</th>
                        <th>Nombre de artículo</th>
                        <th>Stock mínimo</th>
                        <th>Stock máximo</th>
                        <th>Exclusiva</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="placeholder-row">
                        <td colspan="9">Introduzca los filtros y pulse Actualizar para cargar los datos.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../../js/navegacion.js"></script>
</body>

</html>
