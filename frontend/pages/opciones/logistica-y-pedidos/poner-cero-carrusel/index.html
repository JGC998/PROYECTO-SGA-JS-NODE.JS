<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Poner a Cero Carrusel</title>
    <link rel="stylesheet" href="../../../../../css/navegacion.css">
    <style>
        .page-toolbar { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #ddd; margin-bottom:24px; }
        .page-toolbar h1 { font-size:1.2rem; margin:0; }
        .action-panel { max-width:480px; }
        .action-block { background:#fff; border:1px solid #ddd; border-radius:6px; padding:20px; margin-bottom:16px; }
        .action-description { color:#555; margin-bottom:16px; font-size:.9rem; }
        .btn-danger { padding:10px 24px; background:#c0392b; color:#fff; border:none; border-radius:3px; cursor:pointer; font-weight:500; font-size:.95rem; }
        .btn-danger:hover { background:#a93226; }
        .resultado { margin-top:12px; padding:10px; border-radius:4px; display:none; }
        .resultado.ok { display:block; background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .resultado.error { display:block; background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-toolbar">
            <h1>🔄 Poner a Cero Carrusel</h1>
        </header>

        <div class="action-panel">
            <div class="action-block">
                <p class="action-description">
                    Esta acción pone a cero el contador del carrusel. Se recomienda realizarla únicamente cuando el sistema lo requiera o bajo indicación del administrador.
                </p>
                <button class="btn-danger" id="btn-poner-cero">Poner a cero</button>
                <div class="resultado" id="resultado"></div>
            </div>
        </div>
    </main>

    <script src="../../../../../js/navegacion.js"></script>
    <script src="../../../../../js/api.js"></script>
    <script src="../../../../../js/opciones/logistica-y-pedidos/poner-cero-carrusel.js"></script>
</body>

</html>
