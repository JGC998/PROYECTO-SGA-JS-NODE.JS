<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/logistica-y-pedidos/borrar-picking/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>

                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Borrar Picking</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="container">

                <header class="page-toolbar">
                    <div class="toolbar-left">
                        <h1>🗑️ Borrar Picking</h1>
                    </div>
                </header>

                <div class="action-panel">
                    <div class="action-block">
                        <div class="action-row">
                            <label>Número de albarán:</label>
                            <input type="text" class="input-code" id="f-albaran" placeholder="Nº albarán">
                            <button class="btn-danger" id="btn-borrar">Borrar picking</button>
                        </div>
                        <div class="resultado" id="resultado" role="status" aria-live="polite"></div>
                    </div>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
