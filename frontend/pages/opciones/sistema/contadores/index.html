<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Contadores</title>
    <link rel="stylesheet" href="../../../../../css/navegacion.css">
    <style>
        .page-toolbar { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #ddd; margin-bottom:24px; }
        .toolbar-left h1 { font-size:1.2rem; margin:0; }
        .btn-tool { padding:5px 14px; background:#0057b7; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:.85rem; }
        .btn-tool:hover { background:#004499; }
        #grid-contadores { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
        .contador-card { background:#fff; border:1px solid #ddd; border-radius:8px; padding:20px 16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .contador-valor { font-size:2rem; font-weight:700; color:#0057b7; line-height:1.1; }
        .contador-label { font-size:.8rem; color:#666; margin-top:6px; text-transform:uppercase; letter-spacing:.04em; }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>🔢 Contadores del Sistema</h1>
            </div>
            <div>
                <button class="btn-tool" id="btn-actualizar">Actualizar</button>
            </div>
        </header>

        <div id="grid-contadores">
            <p style="padding:20px">Cargando contadores...</p>
        </div>
    </main>

    <script src="../../../../../js/navegacion.js"></script>
    <script src="../../../../../js/api.js"></script>
    <script src="../../../../../js/opciones/sistema/contadores.js"></script>
</body>

</html>
