<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Usuarios del Sistema</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/sistema/usuarios/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Sistema</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Usuarios del Sistema</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="container">

                <header class="page-toolbar">
                    <div class="toolbar-left">
                        <h1>👤 Usuarios del Sistema</h1>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn-tool secondary" id="btn-nuevo">Nuevo</button>
                        <button class="btn-tool" id="btn-guardar">Guardar</button>
                    </div>
                </header>

                <input type="text" class="search-bar" placeholder="Buscar usuario..." id="f-buscar">

                <div class="main-layout">
                    <div class="table-wrapper" id="usuarios-table-wrapper" aria-live="polite" aria-atomic="false">
                        <table>
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Tipo</th>
                                    <th>Nivel</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tbody-usuarios">
                                <tr class="placeholder-row">
                                    <td colspan="5">Cargando usuarios...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="form-panel">
                        <h3>Datos del usuario</h3>
                        <div class="form-row">
                            <label>Código</label>
                            <input type="text" id="usu-codigo">
                        </div>
                        <div class="form-row">
                            <label>Nombre</label>
                            <input type="text" id="usu-nombre">
                        </div>
                        <div class="form-row">
                            <label>Tipo</label>
                            <input type="text" id="usu-tipo">
                        </div>
                        <div class="form-row">
                            <label>Nivel</label>
                            <input type="text" id="usu-nivel">
                        </div>
                    </div>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/sistema/usuarios.js"></script>
</body>

</html>
