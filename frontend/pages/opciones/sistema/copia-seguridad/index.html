<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Copia de Seguridad</title>
    <link rel="stylesheet" href="../../../../../css/navegacion.css">
    <style>
        .page-toolbar { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #ddd; margin-bottom:24px; }
        .page-toolbar h1 { font-size:1.2rem; margin:0; }
        .action-panel { max-width:520px; }
        .action-block { background:#fff; border:1px solid #ddd; border-radius:6px; padding:24px; }
        .action-block p { color:#555; margin:0 0 20px; font-size:.9rem; line-height:1.5; }
        .action-block ul { color:#555; font-size:.85rem; margin:0 0 20px; padding-left:20px; line-height:1.8; }
        .btn-primary { padding:10px 28px; background:#0057b7; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:.95rem; font-weight:500; }
        .btn-primary:hover { background:#004499; }
        .resultado { margin-top:16px; padding:10px 14px; border-radius:4px; display:none; font-size:.9rem; }
        .resultado.ok { display:block; background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .resultado.error { display:block; background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-toolbar">
            <h1>💾 Nueva Copia de Seguridad</h1>
        </header>

        <div class="action-panel">
            <div class="action-block">
                <p>Genera una copia de seguridad de la base de datos <strong>LIN</strong>. Se recomienda realizarla:</p>
                <ul>
                    <li>Al final de cada jornada laboral</li>
                    <li>Antes de actualizaciones del sistema</li>
                    <li>Antes de operaciones masivas de datos</li>
                </ul>
                <button class="btn-primary" id="btn-backup">💾 Iniciar copia de seguridad</button>
                <div class="resultado" id="resultado"></div>
            </div>
        </div>
    </main>

    <script src="../../../../../js/navegacion.js"></script>
    <script src="../../../../../js/api.js"></script>
    <script src="../../../../../js/opciones/sistema/copia-seguridad.js"></script>
</body>

</html>
