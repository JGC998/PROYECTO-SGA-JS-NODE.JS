<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN - Terminales PDA</title>
    <link rel="stylesheet" href="../../../../css/navegacion.css">
    <link rel="stylesheet" href="../../../../css/opciones/sistema/terminales-pda/index.css">
</head>

<body>

    <main class="container">
        <header class="page-toolbar">
            <div class="toolbar-left">
                <h1>Terminales PDA</h1>
            </div>
            <div class="toolbar-actions">
                <button class="btn-tool secondary" id="btn-guardar">Guardar</button>
                <button class="btn-tool secondary" id="btn-nuevo">Nuevo</button>
                <button class="btn-tool secondary btn-danger" id="btn-eliminar">Eliminar</button>
            </div>
        </header>

        <div class="record-nav">
            <div class="nav-field">
                <label>Código de terminal:</label>
                <input type="text" class="input-code" id="f-codigo">
                <button class="btn-nav" id="btn-prev">&#8249;</button>
                <button class="btn-nav" id="btn-next">&#8250;</button>
            </div>
            <div class="nav-field">
                <label>Nombre de terminal:</label>
                <input type="text" class="input-nombre" id="f-nombre">
            </div>
        </div>

        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="general1">Datos generales</button>
            <button class="tab-btn" data-tab="general2">Datos generales (y 2)</button>
            <button class="tab-btn" data-tab="general3">Datos generales (y 3)</button>
        </nav>

        <!-- TAB: Datos generales -->
        <div class="tab-panel active" id="tab-general1">
            <div class="form-section">
                <div class="form-row">
                    <label>Serie de documentos:</label>
                    <input type="text" class="input-xs" id="f-serie">
                    <select class="select-md" id="f-tipo-doc">
                        <option>Pedidos de venta</option>
                        <option>Albaranes</option>
                        <option>Facturas</option>
                        <option>Órdenes de compra</option>
                    </select>
                    <button class="btn-action" id="btn-borrar-ficheros">Borrar ficheros</button>
                </div>

                <div class="form-row">
                    <label>Ficheros de comunicación:</label>
                    <input type="text" class="input-path" id="f-ficheros-com">
                </div>

                <div class="form-row">
                    <label>Ruta de sincronización:</label>
                    <input type="text" class="input-path" id="f-ruta-sinc">
                </div>

                <div class="form-row">
                    <label>Ruta de sincronización wifi:</label>
                    <input type="text" class="input-path" id="f-ruta-wifi">
                </div>

                <div class="form-row">
                    <select class="select-lg" id="f-param-empresa">
                        <option>Tomar este parámetro de empresa</option>
                        <option>Usar configuración propia</option>
                    </select>
                </div>

                <div class="form-row">
                    <select class="select-lg" id="f-cajas-delegacion">
                        <option>No utilizar cajas en delegación central</option>
                        <option>Utilizar cajas en delegación central</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- TAB: Datos generales (y 2) -->
        <div class="tab-panel" id="tab-general2">
            <div class="form-section">
                <div class="empty-tab">
                    <p>Configuración adicional del terminal (y 2).</p>
                </div>
            </div>
        </div>

        <!-- TAB: Datos generales (y 3) -->
        <div class="tab-panel" id="tab-general3">
            <div class="form-section">
                <div class="empty-tab">
                    <p>Configuración adicional del terminal (y 3).</p>
                </div>
            </div>
        </div>
    </main>

    <script src="../../../../js/navegacion.js"></script>
    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        let terminales = [];
        let currentIdx = 0;

        async function cargarTerminales() {
            try {
                const res = await fetch('http://localhost:3000/terminales-pda');
                terminales = await res.json();
                if (terminales.length) mostrarTerminal(0);
            } catch {
                console.error('Error al cargar terminales');
            }
        }

        function mostrarTerminal(idx) {
            currentIdx = idx;
            const t = terminales[idx];
            document.getElementById('f-codigo').value = t.codigo ?? '';
            document.getElementById('f-nombre').value = t.nombre ?? '';
            document.getElementById('f-serie').value = t.serie ?? '';
            document.getElementById('f-ficheros-com').value = t.ficheros_com ?? '';
            document.getElementById('f-ruta-sinc').value = t.ruta_sinc ?? '';
            document.getElementById('f-ruta-wifi').value = t.ruta_wifi ?? '';
        }

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentIdx > 0) mostrarTerminal(currentIdx - 1);
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentIdx < terminales.length - 1) mostrarTerminal(currentIdx + 1);
        });

        document.getElementById('btn-nuevo').addEventListener('click', () => {
            document.getElementById('f-codigo').value = '';
            document.getElementById('f-nombre').value = '';
            document.getElementById('f-serie').value = '';
            document.getElementById('f-ficheros-com').value = '';
            document.getElementById('f-ruta-sinc').value = '';
            document.getElementById('f-ruta-wifi').value = '';
            document.getElementById('f-codigo').focus();
        });

        cargarTerminales();
    </script>
</body>

</html>
