<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Terminales PDA</title>
    <link rel="stylesheet" href="../../../../css/base.css">
    <link rel="stylesheet" href="../../../../css/layout.css">
    <link rel="stylesheet" href="../../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../../css/header.css">
    <link rel="stylesheet" href="../../../../css/buttons.css">
    <link rel="stylesheet" href="../../../../css/animations.css">
    <link rel="stylesheet" href="../../../../css/components.css">
    <link rel="stylesheet" href="../../../../css/responsive.css">
    <link rel="stylesheet" href="../../../../css/opciones/sistema/terminales-pda/index.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../../index.html">Opciones</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <a href="../index.html">Sistema</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Terminales PDA</span>
                </nav>
            </div>
            <div class="sga-header-right"></div>
        </header>

        <div class="sga-content">
            <main class="container">

                <header class="page-toolbar">
                    <div class="toolbar-left">
                        <h1>Terminales PDA</h1>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn-tool secondary" id="btn-guardar">Guardar</button>
                        <button class="btn-tool secondary" id="btn-nuevo">Nuevo</button>
                        <button class="btn-tool secondary btn-danger" id="btn-eliminar">Eliminar</button>
                    </div>
                </header>

                <div class="record-nav">
                    <div class="nav-field">
                        <label>Código de terminal:</label>
                        <input type="text" class="input-code" id="f-codigo">
                        <button class="btn-nav" id="btn-prev">&#8249;</button>
                        <button class="btn-nav" id="btn-next">&#8250;</button>
                    </div>
                    <div class="nav-field">
                        <label>Nombre de terminal:</label>
                        <input type="text" class="input-nombre" id="f-nombre">
                    </div>
                </div>

                <nav class="tab-nav" role="tablist">
                    <button class="tab-btn active" data-tab="general1" role="tab" aria-selected="true" aria-controls="tab-general1">Datos generales</button>
                    <button class="tab-btn" data-tab="general2" role="tab" aria-selected="false" aria-controls="tab-general2">Datos generales (y 2)</button>
                    <button class="tab-btn" data-tab="general3" role="tab" aria-selected="false" aria-controls="tab-general3">Datos generales (y 3)</button>
                </nav>

                <!-- TAB: Datos generales -->
                <div class="tab-panel active" id="tab-general1" role="tabpanel">
                    <div class="form-section">
                        <div class="form-row">
                            <label>Serie de documentos:</label>
                            <input type="text" class="input-xs" id="f-serie">
                            <select class="select-md" id="f-tipo-doc">
                                <option>Pedidos de venta</option>
                                <option>Albaranes</option>
                                <option>Facturas</option>
                                <option>Órdenes de compra</option>
                            </select>
                            <button class="btn-action" id="btn-borrar-ficheros">Borrar ficheros</button>
                        </div>

                        <div class="form-row">
                            <label>Ficheros de comunicación:</label>
                            <input type="text" class="input-path" id="f-ficheros-com">
                        </div>

                        <div class="form-row">
                            <label>Ruta de sincronización:</label>
                            <input type="text" class="input-path" id="f-ruta-sinc">
                        </div>

                        <div class="form-row">
                            <label>Ruta de sincronización wifi:</label>
                            <input type="text" class="input-path" id="f-ruta-wifi">
                        </div>

                        <div class="form-row">
                            <select class="select-lg" id="f-param-empresa">
                                <option>Tomar este parámetro de empresa</option>
                                <option>Usar configuración propia</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <select class="select-lg" id="f-cajas-delegacion">
                                <option>No utilizar cajas en delegación central</option>
                                <option>Utilizar cajas en delegación central</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- TAB: Datos generales (y 2) -->
                <div class="tab-panel" id="tab-general2" role="tabpanel">
                    <div class="form-section">
                        <div class="empty-tab">
                            <p>Configuración adicional del terminal (y 2).</p>
                        </div>
                    </div>
                </div>

                <!-- TAB: Datos generales (y 3) -->
                <div class="tab-panel" id="tab-general3" role="tabpanel">
                    <div class="form-section">
                        <div class="empty-tab">
                            <p>Configuración adicional del terminal (y 3).</p>
                        </div>
                    </div>
                </div>

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../../../js/ui/sidebar.js"></script>
    <script src="../../../../js/ui/layout.js"></script>
    <script src="../../../../js/api.js"></script>
    <script src="../../../../js/opciones/sistema/terminales-pda.js"></script>
</body>

</html>
