<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor - Artículos</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/visor/tablas_visor.css">
</head>

<body>
    <main class="container">
        <header class="visor-header">
            <h1>Consulta General de Artículos</h1>
            <button class="btn-export">📊 Exportar a Excel</button>
        </header>
        <input type="text" class="search-bar" placeholder="Filtrar artículos por cualquier campo...">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Familia</th>
                        <th>Stock Actual</th>
                        <th>Ubicación</th>
                        <th>Últ. Movimiento</th>
                    </tr>
                </thead>
                <tbody id="tbody-visor-articulos">
                    <tr><td colspan="6" style="text-align:center;padding:20px">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="../../js/navegacion.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/visor/articulos.js"></script>
</body>

</html>
