<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor - Proveedores</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/visor/tablas_visor.css">
</head>

<body>
    <main class="container">
        <header class="visor-header">
            <h1>Consulta de Proveedores</h1>
            <button class="btn-export">📊 Listado Contactos</button>
        </header>
        <input type="text" class="search-bar" placeholder="Buscar proveedor...">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Razón Social</th>
                        <th>CIF/NIF</th>
                        <th>Teléfono</th>
                        <th>Localidad</th>
                    </tr>
                </thead>
                <tbody id="tbody-visor-proveedores">
                    <tr><td colspan="5" style="text-align:center;padding:20px">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="../../js/navegacion.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/visor/proveedores.js"></script>
</body>

</html>
