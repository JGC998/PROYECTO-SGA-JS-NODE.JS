<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor - Clientes</title>
    <link rel="stylesheet" href="../../css/navegacion.css">
    <link rel="stylesheet" href="../../css/visor/tablas_visor.css">
</head>

<body>
    <main class="container">
        <header class="visor-header">
            <h1>Consulta de Clientes</h1>
            <button class="btn-export">📊 Exportar Clientes</button>
        </header>
        <input type="text" class="search-bar" placeholder="Buscar cliente por nombre o CIF...">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Cód. Cliente</th>
                        <th>Nombre / Empresa</th>
                        <th>CIF</th>
                        <th>Contacto</th>
                        <th>Zona</th>
                    </tr>
                </thead>
                <tbody id="tbody-visor-clientes">
                    <tr><td colspan="5" style="text-align:center;padding:20px">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="../../js/navegacion.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/visor/clientes.js"></script>
</body>

</html>
