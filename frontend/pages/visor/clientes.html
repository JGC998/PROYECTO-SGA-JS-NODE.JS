<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Consulta de Clientes</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/visor/tablas_visor.css">
</head>

<body class="sga-layout">

    <!-- sidebar.js inyecta <aside class="sga-sidebar"> aquí -->

    <div class="sga-main">

        <header class="sga-header">
            <div class="sga-header-left">
                <button class="sga-hamburger" aria-label="Abrir menú">☰</button>
                <nav class="sga-breadcrumb">
                    <a href="../../index.html">Inicio</a>
                    <span class="sga-breadcrumb-sep">›</span>
                    <span class="sga-breadcrumb-current">Clientes</span>
                </nav>
            </div>
            <div class="sga-header-right">
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-actualizar">Actualizar (F5)</button>
                <button class="sga-btn sga-btn-secondary sga-btn-sm" id="btn-exportar">Exportar</button>
            </div>
        </header>

        <div class="sga-content">
            <main class="cli-inner">

                <div class="cli-page-header">
                    <h1 class="sga-page-title">Consulta de Clientes</h1>
                    <p class="sga-page-description">Maestros · SGA LIN</p>
                </div>

                <div class="filter-bar">
                    <input type="text" class="sga-input cli-search search-bar" id="buscador-clientes"
                        placeholder="Buscar cliente por nombre o CIF...">
                </div>

                <div class="cli-table-card">
                <div class="table-wrapper" id="clientes-table-wrapper" aria-live="polite" aria-atomic="false">
                    <table id="tabla-clientes">
                        <thead>
                            <tr>
                                <th class="col-num">#</th>
                                <th>Cód. cliente</th>
                                <th>Nombre / empresa</th>
                                <th>CIF</th>
                                <th>Contacto</th>
                                <th>Zona</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-visor-clientes">
                            <tr class="placeholder-row">
                                <td colspan="6">Pulse Actualizar para cargar los clientes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                </div><!-- /.cli-table-card -->

            </main>
        </div><!-- /.sga-content -->

    </div><!-- /.sga-main -->

    <script src="../../js/ui/sidebar.js"></script>
    <script src="../../js/ui/layout.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/visor/clientes.js"></script>
</body>

</html>
