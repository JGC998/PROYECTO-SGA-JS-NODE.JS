<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SGA LIN - Movimientos</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/movimientos.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo">SGA LIN</div>
        <div class="nav-links">
            <a href="../index.html" class="nav-item">🏠 Inicio</a>
            <a href="consultas.html" class="nav-item">📊 Ver Tablas</a>
            <a href="entradas.html" class="nav-item">📥 Entradas</a>
            <a href="salidas.html" class="nav-item">📤 Salidas</a>
            <a href="movimientos.html" class="nav-item active">🔄 Movimientos</a>
        </div>
    </nav>

    <main class="container">
        <div class="move-card">
            <h1>🔄 Traspaso de Ubicación</h1>

            <div class="grid-form">
                <div class="form-group full">
                    <label>Artículo (ARTCOD)</label>
                    <input type="text" id="cod" placeholder="Código del producto">
                </div>
                <div class="form-group">
                    <label>📍 Origen</label>
                    <input type="text" id="ubiOri" placeholder="Ubicación actual">
                </div>
                <div class="form-group">
                    <label>🎯 Destino</label>
                    <input type="text" id="ubiDes" placeholder="Nueva ubicación">
                </div>
                <div class="form-group">
                    <label>Lote</label>
                    <input type="text" id="lot" value="GENERAL">
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="cant" value="1">
                </div>
            </div>

            <button class="btn-move" id="btnEjecutar">EJECUTAR MOVIMIENTO</button>
            <div id="resultado" class="msg-box"></div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/movimientos.js"></script>
</body>

</html>
