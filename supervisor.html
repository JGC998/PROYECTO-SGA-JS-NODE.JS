<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA LIN — Supervisor de Picking</title>
    <link rel="stylesheet" href="supervisor.css">
</head>
<body>

<header class="top-bar">
    <div class="top-logo">&#x1F3ED; SGA LIN <small>Supervisor</small></div>

    <nav class="main-tabs" role="tablist">
        <button class="tab-btn" data-tab="nuevo" role="tab" aria-selected="false">
            &#128203; Nueva ruta
        </button>
        <button class="tab-btn tab-active" data-tab="curso" role="tab" aria-selected="true">
            &#8635; En curso <span class="tab-badge" id="badge-curso">0</span>
        </button>
        <button class="tab-btn" data-tab="finalizadas" role="tab" aria-selected="false">
            &#10003; Finalizadas <span class="tab-badge" id="badge-fin">0</span>
        </button>
    </nav>

    <div class="top-right">
        <span class="sse-dot" id="sse-dot" title="Conexión SSE"></span>
        <a href="mapa-3d.html" class="nav-link">&#127922; Visor 3D</a>
        <a href="editor.html"  class="nav-link">&#9881; Editor</a>
    </div>
</header>

<!-- ── TAB: NUEVA RUTA ───────────────────────────────────────────── -->
<section id="tab-nuevo" class="tab-panel" role="tabpanel" style="display:none">
    <div class="creator-layout">

        <!-- Catálogo -->
        <div class="creator-catalog">
            <div class="search-section">
                <div class="search-wrap">
                    <label class="sr-only" for="art-search">Filtrar artículos</label>
                    <span class="search-icon">&#128269;</span>
                    <input id="art-search" type="text"
                        placeholder="Filtrar por código o nombre…"
                        autocomplete="off" spellcheck="false">
                </div>
            </div>
            <div class="catalog-hdr">
                <span>Catálogo <span id="catalog-count" class="badge-sm">0</span></span>
            </div>
            <div id="catalog-list" class="catalog-list">
                <div class="catalog-loading">Cargando artículos…</div>
            </div>
        </div>

        <!-- Ruta en construcción -->
        <div class="creator-route">
            <div class="route-builder-hdr">
                <span>En ruta <span id="items-count" class="badge">0</span></span>
                <button id="btn-clear" class="btn-ghost">&#128465; Limpiar</button>
            </div>
            <div id="items-list" class="items-list"></div>
            <div class="creator-footer">
                <div class="worker-row">
                    <label class="worker-label" for="worker-sel">&#128119; Operario:</label>
                    <select id="worker-sel" class="worker-sel">
                        <option value="">— Sin asignar —</option>
                    </select>
                </div>
                <div class="action-btns">
                    <button id="btn-qr-only"  class="btn-secondary" disabled>&#9646;&#9646; Solo QR</button>
                    <button id="btn-generate" class="btn-primary"   disabled>&#9654; Generar y PDF</button>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- ── TAB: EN CURSO ─────────────────────────────────────────────── -->
<section id="tab-curso" class="tab-panel" role="tabpanel">
    <div class="tab-toolbar">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-v" id="st-total">—</span><span class="stat-l">Total</span></div>
            <div class="stat-item"><span class="stat-v" id="st-hoy">—</span><span class="stat-l">Hoy</span></div>
            <div class="stat-item"><span class="stat-v" id="st-curso" style="color:#3b82f6">—</span><span class="stat-l">En curso</span></div>
            <div class="stat-item"><span class="stat-v" id="st-uds" style="color:#22c55e">—</span><span class="stat-l">Uds. hoy</span></div>
            <button id="btn-csv"     class="btn-csv"     title="Exportar CSV">&#11015; CSV</button>
            <button id="btn-refresh" class="btn-refresh" title="Recargar">&#8635;</button>
        </div>
    </div>
    <div id="curso-grid" class="route-grid">
        <div class="grid-empty">Cargando rutas…</div>
    </div>
</section>

<!-- ── TAB: FINALIZADAS ──────────────────────────────────────────── -->
<section id="tab-finalizadas" class="tab-panel" role="tabpanel" style="display:none">
    <div class="tab-toolbar">
        <div class="fin-toolbar">
            <select id="filter-worker" class="filter-worker">
                <option value="">Todos los operarios</option>
            </select>
        </div>
    </div>
    <div id="fin-grid" class="route-grid">
        <div class="grid-empty">Sin rutas finalizadas</div>
    </div>
</section>

<!-- DETAIL DRAWER -->
<div id="detail-overlay" class="detail-overlay"></div>
<aside id="detail-drawer" class="detail-drawer" aria-label="Detalle de ruta">
    <div class="dd-header">
        <div class="dd-header-left">
            <span class="dd-docnum" id="dd-docnum"></span>
            <span class="dd-badge" id="dd-badge"></span>
        </div>
        <button class="dd-cls" id="dd-cls" aria-label="Cerrar">&times;</button>
    </div>
    <div class="dd-body" id="dd-body"></div>
</aside>

<!-- QR MODAL -->
<div id="qr-modal" class="qr-overlay" style="display:none">
    <div class="qrm-box">
        <div class="qrm-hdr">
            <span>&#9646;&#9646; Ruta en el m&oacute;vil</span>
            <button id="qr-cls" class="qrm-cls" aria-label="Cerrar">&times;</button>
        </div>
        <img id="qr-img" class="qrm-img" src="" alt="QR">
        <div id="qr-url" class="qrm-url"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="supervisor.js"></script>
</body>
</html>
